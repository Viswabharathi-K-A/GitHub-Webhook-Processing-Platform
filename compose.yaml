services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Keep the host .env variable; expose it under tenant 1's scoped name.
      GITHUB_WEBHOOK_SECRET_TENANT_1_LOCAL: ${GITHUB_WEBHOOK_SECRET_LOCAL:-}
    depends_on:
      db:
        condition: service_healthy

  publisher:
    profiles: [publisher]
    build: .
    command: ["python", "outbox_publisher.py"]
    stop_grace_period: 30s
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_healthy

  worker:
    profiles: [worker]
    build: .
    command: ["python", "delivery_worker.py"]
    stop_grace_period: 30s
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SLACK_WEBHOOK_URL_TENANT_1_DEMO: ${SLACK_WEBHOOK_URL_TENANT_1_DEMO:-}
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_healthy

  queue-init:
    profiles: [setup]
    build: .
    command: ["python", "setup_local_sqs.py"]
    depends_on:
      sqs:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      target: development
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TEST_SQS_ENDPOINT_URL: http://sqs:5000
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_healthy

  sqs:
    profiles: [test, publisher, worker, setup]
    image: motoserver/moto:5.1.21
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
